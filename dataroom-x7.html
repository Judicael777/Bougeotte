<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data room Bougeotte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  /* Salle de données virtuelle : index à gauche, pièce au centre sur une feuille blanche, tampon FICTIF */
  --bg:#eef1f5; --paper:#ffffff; --ink:#18212c; --muted:#5a6676; --line:#d9dfe7;
  --accent:#1d4e89; --accent-soft:#e3ecf7; --stamp:#b42318; --ok:#1e7a46; --hl:#fff4c2;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e131a; --paper:#161d26; --ink:#e4e9ef; --muted:#9aa6b5; --line:#2a3542;
    --accent:#86b4ea; --accent-soft:#1c2a3b; --stamp:#f08a7e; --ok:#6fd19a; --hl:#3b3416;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131a; --paper:#161d26; --ink:#e4e9ef; --muted:#9aa6b5; --line:#2a3542;
  --accent:#86b4ea; --accent-soft:#1c2a3b; --stamp:#f08a7e; --ok:#6fd19a; --hl:#3b3416;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{background:var(--stamp);color:#fff;font-size:12.5px;padding:6px 16px;text-align:center;letter-spacing:.02em}
:root[data-theme="dark"] .banner{color:#1a0d0b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner{color:#1a0d0b}}
.top{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--paper)}
.logo{font-weight:700;font-size:19px;letter-spacing:-.01em}
.logo span{color:var(--accent)}
.top .meta{color:var(--muted);font-size:13px}
.top .spacer{flex:1}
.btn{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.primary:hover{color:var(--paper);filter:brightness(1.08)}
.layout{display:grid;grid-template-columns:320px 1fr;min-height:calc(100% - 90px)}
nav{border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--paper);overflow:auto}
.folder{margin:14px 6px 6px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:6px;align-items:baseline;width:100%;text-align:left;font:inherit;font-size:14px;color:var(--ink);background:none;border:0;border-radius:6px;padding:7px 8px;cursor:pointer}
.item:hover{background:var(--accent-soft)}
.item[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.item .ref{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.item .sent{font-size:11px;color:var(--ok);font-weight:600}
main{padding:28px 24px 80px;overflow:auto}
.docbar{max-width:860px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.docbar .info{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.sheet{position:relative;max-width:860px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:48px 56px 56px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(20,30,45,.06)}
.stamp{position:absolute;top:22px;right:24px;border:2px solid var(--stamp);color:var(--stamp);font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.12em;padding:3px 8px;transform:rotate(4deg);opacity:.85}
.sheet h1{font-family:var(--f-doc);font-weight:600;font-size:26px;line-height:1.2;margin:0 0 6px;text-wrap:balance;max-width:85%}
.sheet .sub{color:var(--muted);font-size:13.5px;margin:0 0 26px}
.sheet h2{font-family:var(--f-ui);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:28px 0 8px}
.sheet p,.sheet li{font-family:var(--f-doc);font-size:16px;line-height:1.6;max-width:68ch}
.sheet ul,.sheet ol{padding-left:22px}
.tbl{overflow-x:auto;margin:10px 0 6px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:600}
.mail{border:1px solid var(--line);border-radius:6px;margin:14px 0;overflow:hidden}
.mail .h{background:var(--accent-soft);padding:9px 14px;font-size:13px;font-family:var(--f-mono);line-height:1.6}
.mail .b{padding:12px 16px}
.mail .b p{margin:0 0 10px}
.code{font-family:var(--f-mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;white-space:pre;line-height:1.55}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:30px;padding-top:12px}
.form{border:1px solid var(--line);border-radius:10px;padding:20px;max-width:420px;margin:12px 0;font-family:var(--f-ui)}
.form .f{margin-bottom:12px}
.form label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.form .in{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13.5px;color:var(--muted)}
.form .chk{display:flex;gap:8px;font-size:13.5px;margin:8px 0}
.form .box{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:3px;flex:none;margin-top:3px;display:grid;place-items:center;font-size:12px;line-height:1}
.form .cta{background:var(--accent);color:var(--paper);text-align:center;border-radius:6px;padding:10px;font-weight:600;margin-top:14px}
.slack{border-left:3px solid var(--line);padding:4px 0 4px 14px;margin:12px 0;font-family:var(--f-ui);font-size:14.5px}
.slack b{font-weight:600}
.slack .t{color:var(--muted);font-size:12px;margin-left:6px}
.sig{margin-top:26px}
.home h1{max-width:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0}
.card{border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.card b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.card span{color:var(--muted);font-size:13px}
.menu-toggle{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav{display:none;border-right:0;border-bottom:1px solid var(--line)}
  nav.open{display:block}
  .menu-toggle{display:inline-block}
  .sheet{padding:40px 20px 36px}
  .stamp{top:12px;right:12px}
  main{padding:18px 12px 60px}
  .top .meta{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="banner">Exercice pédagogique ESIEA. Société, personnes, prestataires et documents entièrement fictifs.</div>
<header class="top">
  <button class="btn menu-toggle" id="menuBtn" aria-expanded="false" aria-controls="nav">Pièces</button>
  <div class="logo">Bougeotte<span>.</span> data room</div>
  <div class="meta">Contrôle du 23 novembre 2026 · accès réservé à l'équipe Bougeotte</div>
  <div class="spacer"></div>
  <button class="btn" id="homeBtn">Accueil</button>
  <button class="btn primary" id="bordBtn">Bordereau</button>
</header>
<div class="layout">
  <nav id="nav" aria-label="Pièces de la data room"></nav>
  <main id="main"></main>
</div>

{id:"P04",folder:"Gouvernance",title:"Politique de confidentialité v2.1",date:"02/05/2022",fmt:"Page web",html:`
<h1>Politique de confidentialité</h1>
<p class="sub">Version 2.1, en ligne sur l'application et le site depuis le 2 mai 2022</p>
<h2>Qui sommes-nous ?</h2>
<p>Bougeotte SAS est responsable du traitement de vos données. Contact : dpo@bougeotte.example</p>
<h2>Quelles données ?</h2>
<p>Nous collectons les informations de votre compte, vos séances, vos mesures (poids, fréquence cardiaque, sommeil) et les informations que vous saisissez dans l'application.</p>
<h2>Pourquoi ?</h2>
<p>Pour vous fournir nos services, les améliorer et vous proposer des offres adaptées, sur la base de notre contrat et de notre intérêt légitime.</p>
<h2>Où sont vos données ?</h2>
<p>Vos données sont hébergées exclusivement en France. <b>Elles ne quittent jamais l'Union européenne.</b></p>
<h2>Combien de temps ?</h2>
<p>Nous supprimons votre compte et vos données 3 ans après votre dernière connexion.</p>
<h2>Avec qui ?</h2>
<p>Nous ne vendons jamais vos données. <b>Nous ne partageons jamais vos données de santé avec votre employeur.</b></p>
<h2>Vos droits</h2>
<p>Vous pouvez demander l'accès, la rectification ou la suppression de vos données en écrivant à dpo@bougeotte.example. Nous répondons dans les meilleurs délais.</p>
<h2>Âge minimum</h2>
<p>L'application est accessible à partir de 13 ans.</p>`},

{id:"P06",folder:"Produit",title:"Offre Bougeotte Entreprise : plaquette et contrat type",date:"15/01/2026",fmt:"PDF",html:`
<h1>Bougeotte Entreprise</h1>
<p class="sub">Plaquette commerciale et extrait du contrat type signé avec les 27 employeurs clients</p>
<h2>Plaquette</h2>
<p><b>Des équipes en forme, des risques anticipés.</b> Offrez Bougeotte à vos collaborateurs et pilotez la santé de vos équipes.</p>

/* ============ 3. CONTRATS ============ */
{id:"P08",folder:"Contrats",title:"Contrat d'hébergement Nuage Hexagone",date:"12/06/2023",fmt:"PDF signé",html:`
<h1>Contrat de services d'hébergement et accord de sous-traitance</h1>
<p class="sub">Entre Bougeotte SAS (responsable du traitement) et Nuage Hexagone SAS (sous-traitant). Signé le 12 juin 2023.</p>
<h2>Objet</h2>
<p>Hébergement de l'infrastructure de production de l'application Bougeotte (serveurs, bases de données, stockage objet) dans deux centres de données situés en France.</p>
<h2>Annexe 3 : accord de sous-traitance (article 28 RGPD)</h2>
<ol>
<li>Le sous-traitant agit uniquement sur instruction documentée du responsable du traitement.</li>
<li>Les personnes autorisées à traiter les données sont soumises à la confidentialité.</li>
<li>Le sous-traitant met en œuvre les mesures de sécurité décrites en annexe 4 (chiffrement au repos, cloisonnement, journalisation, plan de continuité).</li>
<li>Le recours à un sous-traitant ultérieur requiert l'autorisation écrite préalable du responsable du traitement.</li>
<li>Le sous-traitant aide le responsable du traitement à répondre aux demandes d'exercice des droits et à respecter ses obligations de sécurité, de notification des violations et d'analyse d'impact.</li>
<li>En fin de contrat, le sous-traitant supprime ou restitue les données, au choix du responsable du traitement.</li>
<li>Le sous-traitant met à disposition les informations nécessaires et permet la réalisation d'audits.</li>
<li>Le sous-traitant notifie toute violation de données dans un délai de 24 heures après en avoir pris connaissance.</li>
</ol>
<p>Aucun transfert de données hors de l'Union européenne. Nuage Hexagone est certifié Hébergeur de données de santé (HDS) et ISO 27001.</p>
<p>Note : la configuration des droits d'accès aux espaces de stockage relève du client (Bougeotte), selon le modèle de responsabilité partagée décrit en annexe 4.</p>`},

{id:"P11",folder:"Sécurité",title:"Politique de sécurité (PSSI) v1.2",date:"17/04/2023",fmt:"PDF",html:`
<h1>Politique de sécurité des systèmes d'information</h1>
<p class="sub">Version 1.2, validée par la Présidente le 17 avril 2023</p>
<h2>Règles</h2>
<ol>
<li>Chaque personne dispose d'un compte nominatif. Les comptes partagés sont interdits.</li>
<li>L'authentification à deux facteurs est obligatoire pour toutes les consoles d'administration.</li>
<li>Les mots de passe ne sont jamais transmis par email, chat ou ticket. Un gestionnaire de mots de passe est fourni.</li>
<li>Les droits d'accès sont revus tous les six mois par le CTO.</li>
<li>Aucune donnée d'utilisateur n'est stockée sur un poste ou un service personnel.</li>
<li>Les espaces de stockage cloud sont privés par défaut. Toute exposition publique est validée par le CTO.</li>
<li>Les journaux d'accès sont conservés 6 mois.</li>
</ol>
<p class="note">Aucune trace de revue des accès n'a été retrouvée pour 2024, 2025 et 2026.</p>`},

const nav = document.getElementById('nav');
const main = document.getElementById('main');
const menuBtn = document.getElementById('menuBtn');
let sent = {};
try { sent = JSON.parse(localStorage.getItem('bougeotte-sent') || '{}'); } catch(e) { sent = {}; }
function saveSent(){ try { localStorage.setItem('bougeotte-sent', JSON.stringify(sent)); } catch(e){} }

function renderNav(current){
  const folders = [...new Set(PIECES.map(p => p.folder))];
  nav.innerHTML = folders.map(f => `
    <div class="folder">${f}</div>
    ${PIECES.filter(p => p.folder === f).map(p => `
      <button class="item" data-id="${p.id}" aria-current="${p.id === current}">
        <span class="ref">${p.id}</span><span>${p.title}</span>${sent[p.id] ? '<span class="sent">envoyée</span>' : '<span></span>'}
      </button>`).join('')}
  `).join('');
  nav.querySelectorAll('.item').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.id.toLowerCase(); closeMenu(); }));
}

function renderPiece(p){
  const isSent = !!sent[p.id];
  main.innerHTML = `
    <div class="docbar">
      <div class="info">${p.id} · ${p.folder} · ${p.fmt} · ${p.date}</div>
      <button class="btn ${isSent ? '' : 'primary'}" id="sendBtn">${isSent ? 'Retirer du bordereau' : 'Marquer comme communiquée'}</button>
    </div>
    <article class="sheet"><div class="stamp">FICTIF</div>${p.html}</article>`;
  document.getElementById('sendBtn').addEventListener('click', () => {
    if (sent[p.id]) delete sent[p.id];
    else sent[p.id] = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    saveSent(); route();
  });
  main.scrollTop = 0; window.scrollTo(0,0);
}

function renderHome(){
  const folders = [...new Set(PIECES.map(p => p.folder))];
  main.innerHTML = `
    <article class="sheet home"><div class="stamp">FICTIF</div>
      <h1>Data room de contrôle</h1>
      <p class="sub">Bougeotte SAS · application de coaching sportif et bien-être · Lyon</p>
      <p>Ce dossier rassemble les documents internes de Bougeotte. Il est réservé à l'équipe contrôlée. Les contrôleurs n'y ont pas accès : ils doivent demander chaque pièce.</p>
      <p>Quand vous remettez une pièce aux contrôleurs, cliquez sur <b>Marquer comme communiquée</b>. Le bordereau se remplit tout seul, avec l'heure de remise.</p>
      <div class="cards">
        <div class="card"><b>${PIECES.length}</b><span>pièces disponibles</span></div>
        <div class="card"><b>${folders.length}</b><span>dossiers</span></div>
        <div class="card"><b>${Object.keys(sent).length}</b><span>pièces communiquées</span></div>
      </div>
      <h2>Rappel</h2>
      <p>Vous ne pouvez pas mentir aux contrôleurs ni détruire de pièce. Vous pouvez choisir l'ordre, le rythme et la manière de répondre.</p>
    </article>`;
}

function renderBordereau(){
  const rows = PIECES.filter(p => sent[p.id]);
  const text = 'Bordereau de communication de pièces - Bougeotte SAS - contrôle du 23/11/2026\n' +
    rows.map(p => `${p.id} | ${p.title} | remise à ${sent[p.id]}`).join('\n');
  main.innerHTML = `
    <article class="sheet"><div class="stamp">FICTIF</div>
      <h1>Bordereau de communication de pièces</h1>
      <p class="sub">Contrôle du 23 novembre 2026 · Bougeotte SAS</p>
      ${rows.length ? `<div class="tbl"><table><tr><th>Pièce</th><th>Intitulé</th><th>Remise</th></tr>
        ${rows.map(p => `<tr><td style="font-family:var(--f-mono)">${p.id}</td><td>${p.title}</td><td>${sent[p.id]}</td></tr>`).join('')}
      </table></div>` : '<p>Aucune pièce communiquée pour le moment.</p>'}
      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
        <button class="btn primary" id="copyBtn">Copier le bordereau</button>
        <button class="btn" id="resetBtn">Vider le bordereau</button>
        <span id="msg" style="color:var(--muted);font-size:13px;align-self:center"></span>
      </div>
    </article>`;
  document.getElementById('copyBtn').addEventListener('click', async () => {
    const msg = document.getElementById('msg');
    try { await navigator.clipboard.writeText(text); msg.textContent = 'Bordereau copié.'; }
    catch(e){ msg.textContent = 'Copie refusée par le navigateur : sélectionnez le tableau à la main.'; }
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    const b = document.getElementById('resetBtn');
    if (b.dataset.confirm) { sent = {}; saveSent(); route(); }
    else { b.dataset.confirm = '1'; b.textContent = 'Cliquer encore pour confirmer'; }
  });
}

function route(){
  const h = (location.hash || '').replace('#','').toUpperCase();
  const p = PIECES.find(x => x.id === h);
  if (p) { renderNav(p.id); renderPiece(p); }
  else if (h === 'BORDEREAU') { renderNav(null); renderBordereau(); }
  else { renderNav(null); renderHome(); }
}
function closeMenu(){ nav.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false'); }
menuBtn.addEventListener('click', () => { const o = nav.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(o)); });
document.getElementById('homeBtn').addEventListener('click', () => { location.hash = 'accueil'; });
document.getElementById('bordBtn').addEventListener('click', () => { location.hash = 'bordereau'; });
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
