<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boutique Bougeotte</title>
<script>
/* ===== CONFIGURATION (à adapter avant le cours) ===== */
window.BGT_TRACKER = "";            /* adresse du second site qui héberge tracker/ (facultatif) */
window.BGT_TEAM_CODE = "equipe";     /* code du back-office, donné aux équipes en manche 2 */
window.BGT_TRAINER_CODE = "JPN"; /* code formateur : tableau de bord et corrigé */
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Boutique sport : fond clair, vert profond de marque, accent corail pour l'action, grille produits */
  --bg:#f5f7f4; --card:#ffffff; --ink:#14201a; --muted:#5d6b63; --line:#dfe5e0;
  --brand:#0f5c45; --brand-soft:#e2f0ea; --act:#e8553d; --warn:#9a3412;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1512; --card:#18211c; --ink:#e7eee9; --muted:#9db0a5; --line:#2a3a31;
    --brand:#5fc39d; --brand-soft:#173126; --act:#ff7a63; --warn:#fdba74; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1512; --card:#18211c; --ink:#e7eee9; --muted:#9db0a5; --line:#2a3a31;
  --brand:#5fc39d; --brand-soft:#173126; --act:#ff7a63; --warn:#fdba74; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.fict{background:#7c2d12;color:#fff;font-size:12.5px;text-align:center;padding:5px 12px}
header{display:flex;align-items:center;gap:20px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--brand);text-decoration:none;letter-spacing:-.02em}
header nav{display:flex;gap:18px;flex:1;flex-wrap:wrap}
header nav a{color:var(--ink);text-decoration:none;font-weight:500}
header nav a:hover{color:var(--brand)}
.cartlink{font-weight:600;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;background:var(--brand);color:#fff;border-radius:18px;padding:32px;margin-bottom:28px}
.hero h1{font-family:var(--f-display);font-size:38px;line-height:1.05;margin:0 0 10px;text-wrap:balance}
.hero p{margin:0;opacity:.9;max-width:46ch}
.hero .promo{background:rgba(255,255,255,.12);border-radius:12px;padding:18px;font-size:15px}
.hero .promo b{font-family:var(--f-display);font-size:28px;display:block}
h2{font-family:var(--f-display);font-size:24px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.prod .img{aspect-ratio:4/3;display:grid;place-items:center}
.prod .img svg{width:46%;height:auto}
.prod .body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod .name{font-weight:600}
.prod .price{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.prod .desc{color:var(--muted);font-size:14px;flex:1}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--act);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.brand{background:var(--brand);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl{overflow-x:auto}
.form{display:grid;gap:14px;max-width:520px}
.form label{font-weight:600;font-size:14px;display:block;margin-bottom:4px}
.form input,.form select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.chk input{width:auto;margin-top:4px}
.hint{font-size:13px;color:var(--muted)}
.info{font-size:13.5px;color:var(--muted);border-left:3px solid var(--brand);padding:6px 12px;background:var(--brand-soft);border-radius:0 8px 8px 0}
.msg{padding:12px 14px;border-radius:10px;background:var(--brand-soft);margin-top:12px}
footer{border-top:1px solid var(--line);padding:24px;color:var(--muted);font-size:14px;display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
footer a{color:var(--muted)}
.prose p,.prose li{max-width:70ch}

/* Bandeau cookies */
#cmp{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.12);padding:18px 24px}
#cmp .in{max-width:1080px;margin:0 auto;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
#cmp p{margin:0;flex:1;min-width:260px;font-size:14.5px}
#cmp .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linklike{background:none;border:0;font:inherit;font-size:12px;color:#b9c2bd;cursor:pointer;padding:4px;text-decoration:underline}
#prefs{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
#prefs.open{display:flex}
#prefs .box{background:var(--card);border-radius:16px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:24px}
.purpose{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.purpose .row{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:600}
.purpose p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.switch{position:relative;width:44px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + span{background:var(--brand)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:disabled + span{opacity:.6;cursor:not-allowed}
.spacer-long{height:420px}

@media (max-width:760px){.hero{grid-template-columns:1fr}.hero h1{font-size:30px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.steps{display:flex;gap:8px;flex-wrap:wrap;list-style:none;padding:0;margin:0 0 18px;font-size:14px}
.steps li{padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps li.on{background:var(--brand);border-color:var(--brand);color:#fff}
.steps li.done{color:var(--brand)}
.cols3{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.cols3 h3{margin-top:0}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
.stack{display:grid;gap:14px;margin-bottom:16px}
.btn.sm{padding:6px 10px;font-size:14px}
.reco{margin:0 0 28px}
.store{margin-top:28px}
.timer{margin-top:10px;font-weight:600}
.timer span{font-variant-numeric:tabular-nums;background:rgba(0,0,0,.25);padding:2px 8px;border-radius:6px}
.card-test{border:1px dashed var(--line);border-radius:12px;padding:16px;max-width:420px;margin-bottom:12px}
.card-test .num{font-family:ui-monospace,Menlo,monospace;font-size:18px;margin:8px 0}
.dump{white-space:pre-wrap;font-size:12.5px;background:var(--bg);padding:12px;border-radius:8px}
.brk{word-break:break-all}.small{font-size:12.5px}
.narrow{max-width:460px;margin:0 auto}
.lbl{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.inp{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.setting{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0}
.setting legend{font-weight:600;padding:0 6px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:15px;cursor:pointer}
.opt input{margin-top:5px}
.sticky-bottom{position:sticky;bottom:12px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
table.board td.good{color:var(--brand);font-weight:600}
table.board td.bad{color:var(--act);font-weight:600}
table.board tr.th td{background:var(--brand-soft);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#chatBtn{position:fixed;right:20px;bottom:20px;z-index:15;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#chat{position:fixed;right:20px;bottom:20px;z-index:25;width:min(380px,calc(100vw - 40px));max-height:min(560px,80vh);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:none;flex-direction:column;overflow:hidden}
#chat.open{display:flex}
.chat-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--brand);color:#fff}
.chat-note{font-size:12.5px;padding:8px 14px;background:var(--brand-soft);color:var(--ink)}
.chat-b{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.bub{max-width:85%;padding:8px 12px;border-radius:12px;font-size:14.5px;line-height:1.45}
.bub.bot{background:var(--bg);align-self:flex-start}
.bub.me{background:var(--brand);color:#fff;align-self:flex-end}
.chat-f{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat-f input{flex:1;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.linklike2{background:none;border:0;font:inherit;font-size:13px;color:inherit;cursor:pointer;text-decoration:underline;padding:6px 14px;align-self:flex-start}
#pop{position:fixed;inset:0;z-index:28;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
#pop.open{display:flex}
#pop .box{background:var(--card);border-radius:16px;max-width:440px;width:100%;padding:24px}
#scnBadge{font-size:12px;color:var(--muted)}
body.backoffice #cmp,body.backoffice #chatBtn{display:none!important}
</style>
</head>
<body>
<div class="fict">Site fictif créé pour un exercice pédagogique. Aucune commande, aucun paiement, aucune donnée n'est réellement envoyée.</div>
<header>
  <a class="logo" href="#accueil">bougeotte</a>
  <nav aria-label="Navigation principale">
    <a href="#accueil">Boutique</a>
    <a href="#mon-compte">Mon compte</a>
    <a href="#cookies-politique">Cookies</a>
  </nav>
  <span id="scnBadge"></span>
  <a class="cartlink" href="#panier" id="cartLink">Panier (0)</a>
</header>
<main class="wrap" id="view"></main>
<footer>
  <span>Bougeotte SAS (fictive), Lyon</span>
  <a href="#confidentialite">Confidentialité</a>
  <a href="#cookies-politique">Politique cookies</a>
  <a href="#" id="manage" hidden>Gérer mes cookies</a>
</footer>
<button class="btn" id="chatBtn">Besoin d'aide ?</button>
<div id="chat" role="dialog" aria-label="Assistant"></div>
<div id="pop" role="dialog" aria-modal="true" aria-label="Newsletter"></div>
<div id="cmp" hidden></div>
<div id="prefs" role="dialog" aria-modal="true" aria-labelledby="prefsTitle"><div class="box" id="prefsBox"></div></div>
<script>
const TRACKER = window.BGT_TRACKER || "";
const TEAM_CODE = window.BGT_TEAM_CODE || "equipe";
const TRAINER_CODE = window.BGT_TRAINER_CODE || "formateur";
/* ====== RÉGLAGES DU BACK-OFFICE (chaque réglage cache un piège) ======
   Chaque option : k = clé, t = libellé neutre (vu par les étudiants), ok = conforme ou non.
   why = explication du corrigé, ref = fondement (les références marquées « à vérifier » doivent l'être avant diffusion). */
const SETTINGS = [
/* ---------- Cookies et bandeau ---------- */
{id:"tags_timing", theme:"Cookies et bandeau", label:"Chargement des balises marketing et statistiques",
 opts:[{k:"load", t:"Au chargement de la page", ok:false},{k:"after", t:"Après le choix du visiteur", ok:true}],
 why:"Les traceurs non exemptés ne peuvent être déposés qu'après le consentement.", ref:"Art. 82 loi Informatique et Libertés"},
{id:"banner_buttons", theme:"Cookies et bandeau", label:"Boutons du bandeau (premier niveau)",
 opts:[{k:"ok", t:"« OK » et un lien « Personnaliser »", ok:false},{k:"accperso", t:"« Tout accepter » et « Personnaliser »", ok:false},{k:"three", t:"« Tout refuser », « Tout accepter » et « Personnaliser »", ok:true}],
 why:"Refuser doit être aussi simple qu'accepter, dès le premier niveau.", ref:"Lignes directrices et recommandation cookies de la CNIL (2020)"},
{id:"banner_text", theme:"Cookies et bandeau", label:"Texte du bandeau",
 opts:[{k:"short", t:"« En poursuivant votre navigation, vous acceptez les cookies »", ok:false},{k:"full", t:"Texte détaillé : finalités, partenaires, retrait du choix", ok:true}],
 why:"Information insuffisante, et la poursuite de la navigation ne vaut pas consentement.", ref:"Art. 4.11 et 7 RGPD ; art. 82 loi Informatique et Libertés"},
{id:"scroll_consent", theme:"Cookies et bandeau", label:"Défilement de la page par le visiteur",
 opts:[{k:"accept", t:"Vaut acceptation après quelques défilements", ok:false},{k:"none", t:"Sans effet sur le choix", ok:true}],
 why:"Le consentement doit résulter d'un acte positif clair.", ref:"Art. 4.11 RGPD"},
{id:"prefs_default", theme:"Cookies et bandeau", label:"Interrupteurs du panneau « Personnaliser »",
 opts:[{k:"on", t:"Activés par défaut", ok:false},{k:"off", t:"Désactivés par défaut", ok:true}],
 why:"Des cases précochées ne recueillent pas un consentement valable.", ref:"Art. 4.11 RGPD ; CJUE Planet49 (2019)"},
{id:"prefs_refuse", theme:"Cookies et bandeau", label:"Bouton « Tout refuser » du panneau",
 opts:[{k:"hidden", t:"En bas du panneau, en lien discret", ok:false},{k:"top", t:"En haut, même style que « Tout accepter »", ok:true}],
 why:"Asymétrie entre accepter et refuser.", ref:"Recommandation cookies de la CNIL"},
{id:"refuse_effect", theme:"Cookies et bandeau", label:"Effet d'un refus",
 opts:[{k:"partial", t:"Supprime les cookies publicitaires", ok:false},{k:"all", t:"Supprime tous les traceurs non exemptés", ok:true}],
 why:"Après un refus, _lm_id, rpc_rec et le localStorage restaient : le refus n'est pas respecté.", ref:"Art. 82 loi Informatique et Libertés"},
{id:"withdraw_link", theme:"Cookies et bandeau", label:"Lien « Gérer mes cookies » en pied de page",
 opts:[{k:"no", t:"Non affiché", ok:false},{k:"yes", t:"Affiché sur toutes les pages", ok:true}],
 why:"Il doit être aussi simple de retirer son consentement que de le donner.", ref:"Art. 7.3 RGPD"},
{id:"consent_life", theme:"Cookies et bandeau", label:"Durée de mémorisation du choix",
 opts:[{k:"13m", t:"13 mois", ok:false},{k:"6m", t:"6 mois", ok:true}],
 why:"La CNIL recommande de redemander le choix au bout d'environ 6 mois (à vérifier).", ref:"Recommandation cookies de la CNIL"},
{id:"analytics_life", theme:"Cookies et bandeau", label:"Durée du cookie d'audience _lm_id",
 opts:[{k:"2y", t:"2 ans", ok:false},{k:"13m", t:"13 mois", ok:true}],
 why:"Durée excessive, et contraire à la politique cookies qui annonce 13 mois.", ref:"Lignes directrices cookies de la CNIL (à vérifier)"},
{id:"fingerprint", theme:"Cookies et bandeau", label:"Empreinte navigateur Loopmetric (localStorage)",
 opts:[{k:"on", t:"Activée", ok:false},{k:"off", t:"Désactivée", ok:true}],
 why:"Le localStorage est un traceur au même titre qu'un cookie. L'empreinte est déposée sans consentement.", ref:"Art. 82 loi Informatique et Libertés"},
{id:"chat_widget", theme:"Cookies et bandeau", label:"Chargement du widget de chat",
 opts:[{k:"load", t:"Avec la page", ok:false},{k:"open", t:"À l'ouverture du chat par le visiteur", ok:true}],
 why:"Le cookie du chat n'est exempté que s'il est déposé quand l'utilisateur ouvre le chat.", ref:"Lignes directrices cookies de la CNIL"},
{id:"cookie_policy", theme:"Cookies et bandeau", label:"Page « Politique cookies »",
 opts:[{k:"short", t:"Version courte", ok:false},{k:"table", t:"Tableau détaillé des cookies", ok:true}],
 why:"Information vague, durée annoncée fausse, renvoi au navigateur.", ref:"Art. 82 loi Informatique et Libertés ; art. 13 RGPD"},
{id:"replay_mask", theme:"Cookies et bandeau", label:"ReplayCam : enregistrement des saisies",
 opts:[{k:"raw", t:"Saisies enregistrées telles quelles", ok:false},{k:"mask", t:"Saisies masquées", ok:true}],
 why:"L'enregistreur capte poids, santé et mot de passe.", ref:"Art. 5.1.c, 9 et 32 RGPD"},

/* ---------- Compte et formulaires ---------- */
{id:"signup_fields", theme:"Compte et formulaires", label:"Champs du formulaire d'inscription",
 opts:[{k:"full", t:"Complet : civilité, téléphone, naissance, poids, santé", ok:false},{k:"min", t:"Minimal : email, mot de passe, prénom facultatif", ok:true}],
 why:"Collecte excessive, dont des données de santé sans nécessité, avec un accord noyé dans les CGU.", ref:"Art. 5.1.c et 9 RGPD"},
{id:"signup_optins", theme:"Compte et formulaires", label:"Cases newsletter et offres partenaires",
 opts:[{k:"checked", t:"Cochées par défaut", ok:false},{k:"unchecked", t:"Décochées, newsletter uniquement", ok:true}],
 why:"Consentement par défaut, invalide.", ref:"Art. 7 RGPD ; art. L.34-5 CPCE"},
{id:"info_notice", theme:"Compte et formulaires", label:"Mention d'information sous les formulaires",
 opts:[{k:"no", t:"Non affichée", ok:false},{k:"yes", t:"Affichée", ok:true}],
 why:"Les personnes doivent être informées au moment de la collecte.", ref:"Art. 13 RGPD"},
{id:"pwd_policy", theme:"Compte et formulaires", label:"Règle de mot de passe",
 opts:[{k:"4", t:"4 caractères minimum", ok:false},{k:"12", t:"12 caractères avec complexité", ok:true}],
 why:"Mot de passe trop faible.", ref:"Art. 32 RGPD ; recommandation CNIL mots de passe (à vérifier)"},
{id:"pwd_email", theme:"Compte et formulaires", label:"Email de confirmation d'inscription",
 opts:[{k:"pwd", t:"Rappelle le mot de passe choisi", ok:false},{k:"link", t:"Contient seulement un lien de confirmation", ok:true}],
 why:"Mot de passe transmis en clair.", ref:"Art. 32 RGPD"},

/* ---------- Tunnel d'achat ---------- */
{id:"guest_checkout", theme:"Tunnel d'achat", label:"Commande sans compte",
 opts:[{k:"no", t:"Impossible, compte obligatoire", ok:false},{k:"yes", t:"Possible en invité", ok:true}],
 why:"Imposer un compte pour un achat ponctuel n'est pas justifié.", ref:"Recommandations 2/2025 du CEPD (statut final à vérifier)"},
{id:"shipping_fields", theme:"Tunnel d'achat", label:"Champs de livraison",
 opts:[{k:"wide", t:"Étendus : naissance, situation familiale, source", ok:false},{k:"need", t:"Nécessaires à la livraison", ok:true}],
 why:"Minimisation : ces données ne servent pas à livrer.", ref:"Art. 5.1.c RGPD"},
{id:"cart_capture", theme:"Tunnel d'achat", label:"Relance des paniers abandonnés",
 opts:[{k:"live", t:"Capture des champs pendant la saisie", ok:false},{k:"off", t:"Désactivée", ok:true}],
 why:"Collecte avant validation, sans information.", ref:"Art. 5.1.a et 13 RGPD"},
{id:"save_card", theme:"Tunnel d'achat", label:"Case « Enregistrer ma carte »",
 opts:[{k:"checked", t:"Cochée par défaut", ok:false},{k:"unchecked", t:"Décochée par défaut", ok:true}],
 why:"La conservation de la carte entre deux achats exige un consentement préalable.", ref:"Recommandation CNIL sur le paiement à distance"},
{id:"loyalty", theme:"Tunnel d'achat", label:"Programme de fidélité",
 opts:[{k:"auto", t:"Inscription automatique avec partage aux partenaires", ok:false},{k:"none", t:"Pas d'inscription automatique", ok:true}],
 why:"Consentement forcé, prospection par email et SMS sans accord.", ref:"Art. 7 RGPD ; art. L.34-5 CPCE"},

/* ---------- Sécurité ---------- */
{id:"login_errors", theme:"Sécurité", label:"Messages d'erreur de connexion et d'inscription",
 opts:[{k:"precise", t:"Précis : compte inexistant, mauvais mot de passe", ok:false},{k:"generic", t:"Message unique", ok:true}],
 why:"Permet de savoir si une adresse a un compte (énumération).", ref:"Art. 32 RGPD"},
{id:"login_limit", theme:"Sécurité", label:"Tentatives de connexion",
 opts:[{k:"unlimited", t:"Illimitées", ok:false},{k:"5", t:"5 tentatives puis blocage temporaire", ok:true}],
 why:"Ouvre la porte aux attaques par force brute.", ref:"Art. 32 RGPD"},
{id:"pwd_storage", theme:"Sécurité", label:"Stockage des mots de passe",
 opts:[{k:"plain", t:"Tels quels", ok:false},{k:"hash", t:"Empreinte (hachage)", ok:true}],
 why:"Mot de passe stocké en clair.", ref:"Art. 32 RGPD"},
{id:"session_life", theme:"Sécurité", label:"Durée de connexion",
 opts:[{k:"1y", t:"1 an", ok:false},{k:"session", t:"Jusqu'à la fermeture du navigateur", ok:true}],

/* ====== SCÉNARIO : lu dans le lien (?s=...) ====== */
const KEY = "bougeotte";
function xorStr(s){ let o = ""; for (let i = 0; i < s.length; i++) o += String.fromCharCode(s.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)); return o; }
function b64e(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function b64d(s){ s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return decodeURIComponent(escape(atob(s))); }
function presetValues(kind){ return Object.fromEntries(SETTINGS.map(s => [s.id, (kind === "ok" ? s.opts.find(o => o.ok) : s.opts.find(o => !o.ok)).k])); }
function encodeScenario(sc){
  const digits = SETTINGS.map(s => Math.max(0, s.opts.findIndex(o => o.k === sc.values[s.id]))).join("");
  return b64e(xorStr(JSON.stringify({n:sc.name || "", p:sc.pays || "FR", d:digits, v:1})));
}
function decodeScenario(code){
  if (!code || code === "nc") return {name:"Base non conforme", pays:"FR", values:presetValues("nc"), code:"nc"};
  if (code === "ok") return {name:"Base conforme", pays:"FR", values:presetValues("ok"), code:"ok"};
  try {
    const o = JSON.parse(xorStr(b64d(code)));
    const values = {};
    SETTINGS.forEach((s, i) => { const idx = parseInt(o.d[i] || "0", 10); values[s.id] = (s.opts[idx] || s.opts[0]).k; });
    return {name:o.n || "Sans nom", pays:o.p || "FR", values, code};
  } catch(e){ return null; }
}

const V = id => SCN.values[id];
const OK = id => { const s = SETTINGS.find(x => x.id === id); return !!(s && s.opts.find(o => o.k === V(id) && o.ok)); };
const NC = id => !OK(id);

const SECURE = location.protocol === "https:" ? "; Secure" : "";
function setCookie(name, value, maxAgeSec){
  let c = name + "=" + encodeURIComponent(value) + "; path=/; SameSite=Lax" + SECURE;
  if (maxAgeSec) c += "; max-age=" + maxAgeSec;
  try { document.cookie = c; } catch(e){}
}
function getCookie(name){
  try { const m = document.cookie.split("; ").find(r => r.startsWith(name + "=")); return m ? decodeURIComponent(m.split("=").slice(1).join("=")) : null; }
  catch(e){ return null; }
}
function delCookie(name){ try { document.cookie = name + "=; path=/; max-age=0"; } catch(e){} }
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){ return null; } }
function ss(k, v){ try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch(e){ return null; } }
const rid = (n) => Array.from({length:n}, () => "abcdef0123456789"[Math.floor(Math.random()*16)]).join("");

  if (!recorderOn) return;

function getConsent(){ try { return JSON.parse(getCookie("bgt_consent") || "null"); } catch(e){ return null; } }
function saveConsent(c){ c.date = new Date().toISOString(); setCookie("bgt_consent", JSON.stringify(c), (V("consent_life") === "6m" ? 182 : 395) * DAY); }

function bootTrackers(){
  dropEssential();

  if (NC("tags_timing")){
    dropAnalytics(); dropAds(); dropReplay(); dropABTest();
    if (c && !c.analytics && !c.ads) removeNonEssential();
  } else if (c) applyConsent(c);
  if (!c) showBanner();
  if (NC("scroll_consent")){
    let n = 0;
    window.addEventListener("scroll", function onS(){
      if (getConsent()) return window.removeEventListener("scroll", onS);
      if (++n > 25){ const all = {analytics:true, ads:true, replay:true, abtest:true, via:"defilement"}; saveConsent(all); applyConsent(all); hideBanner(); window.removeEventListener("scroll", onS); }
    }, {passive:true});
  }
}

function currentUser(){ const e = getCookie("bgt_auth"); const u = getUsers(); return e && u[e] && !u[e].deleted ? u[e] : null; }
async function hashPwd(p){
  try { const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("bgt-sel-demo:" + p)); return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join(""); }
  catch(e){ return "hash-indisponible"; }
}
function login(email){ setCookie("bgt_auth", email, V("session_life") === "1y" ? 365*DAY : 0); }
function logout(){ delCookie("bgt_auth"); }
const infoNotice = (txt) => OK("info_notice") ? `<p class="info">${txt} Vous pouvez accéder à vos données, les corriger, les effacer, vous opposer ou retirer votre consentement depuis votre espace client ou à dpo@bougeotte.example, et saisir la CNIL. <a href="#confidentialite">Politique de confidentialité</a></p>` : "";

/* ====== PAGES DE LA BOUTIQUE ====== */
const view = document.getElementById("view");
const btnLink = (href, label, cls = "") => `<a class="btn ${cls}" href="#${href}" style="text-decoration:none">${label}</a>`;
function steps(n){
  const labels = ["Panier", "Identification", "Livraison", "Paiement", "Confirmation"];
  return `<ol class="steps">${labels.map((l, i) => `<li class="${i === n ? "on" : i < n ? "done" : ""}">${i + 1}. ${l}</li>`).join("")}</ol>`;
}

function promoBlock(){
  if (V("countdown") === "fake"){
    return `<div class="promo"><b>-15 %</b>sur la montre Pulse 2 avec le code RENTREE.<div class="timer">L'offre expire dans <span id="cd">15:00</span></div></div>`;
  }
  return `<div class="promo"><b>-15 %</b>sur la montre Pulse 2 avec le code RENTREE, jusqu'au 30 novembre.</div>`;
}
function startCountdown(){
  const el = document.getElementById("cd"); if (!el) return;
  let t = 15 * 60;
  const tick = () => { if (!document.body.contains(el)) return; t = Math.max(0, t - 1); el.textContent = String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); setTimeout(tick, 1000); };
  setTimeout(tick, 1000);
}
function recoBlock(){
  const u = currentUser();
  if (V("reco") === "health" && u && (u.sante || u.poids)){
    const s = (u.sante || "").toLowerCase();
    const pick = PRODUCTS.filter(p => (s.includes("dos") && p.tag === "dos") || (s.includes("genou") && p.tag === "genou") || (s.includes("asthme") && p.tag === "cardio") || (u.poids && p.tag === "poids"));
    if (!pick.length) pick.push(PRODUCTS[1]);
    return `<section class="reco"><h2>Sélectionné pour vous</h2><p class="hint">Parce que vous nous avez indiqué « ${esc(u.sante || "votre poids : " + u.poids + " kg")} », nous vous recommandons :</p><div class="grid">${pick.slice(0, 3).map(productCard).join("")}</div></section>`;
  }
  const inCart = cartLines();
  if (OK("reco") && inCart.length){
    const others = PRODUCTS.filter(p => !inCart.find(l => l.p.id === p.id)).slice(0, 3);
    return `<section class="reco"><h2>Souvent achetés ensemble</h2><div class="grid">${others.map(productCard).join("")}</div></section>`;
  }
  return "";
}
function pageHome(){
  const title = getCookie("tgb_ab") === "hero_B" ? "Bougez plus, stressez moins." : "Votre coach, au poignet.";
  view.innerHTML = `
    <section class="hero"><div><h1>${title}</h1><p>Montres, balances et accessoires qui se synchronisent avec l'application Bougeotte.</p></div>${promoBlock()}</section>
    ${recoBlock()}
    <h2>Nos produits</h2>
    <div class="grid">${PRODUCTS.map(productCard).join("")}</div>
    <section class="store panel"><h2>Nos magasins</h2><p>Essayez nos montres à Lyon, Paris et Nantes.</p>
      ${OK("geoloc") ? `<button class="btn ghost" id="geoBtn">Trouver le magasin le plus proche</button>` : ""}<div id="geoOut" class="hint"></div></section>
    <div style="height:500px" aria-hidden="true"></div>`;
  view.querySelectorAll("[data-add]").forEach(b => b.onclick = () => addToCart(b.dataset.add));
  const g = document.getElementById("geoBtn"); if (g) g.onclick = askGeo;
  startCountdown();

}
function askGeo(){
  const out = document.getElementById("geoOut");
  if (!navigator.geolocation){ if (out) out.textContent = "Localisation indisponible sur ce navigateur."; return; }
  try {
    navigator.geolocation.getCurrentPosition(pos => {
      ls("bgt_geo", JSON.stringify({lat:pos.coords.latitude.toFixed(4), lon:pos.coords.longitude.toFixed(4), date:new Date().toISOString(), envoye_a:"Loopmetric, AdNexa"}));
      if (consented("ads")) pixel("anx", "geo");
      const o = document.getElementById("geoOut"); if (o) o.textContent = "Magasin le plus proche : Bougeotte Lyon Confluence (simulation).";
    }, () => { const o = document.getElementById("geoOut"); if (o) o.textContent = "Localisation refusée. Choisissez une ville : Lyon, Paris ou Nantes."; }, {timeout:8000});
  } catch(e){}
}
function maybePopup(){
  if (ss("bgt_pop")) return;
  setTimeout(() => {
    if ((location.hash || "#accueil") !== "#accueil" || ss("bgt_pop")) return;
    ss("bgt_pop", "1");
    const p = document.getElementById("pop");
    const no = V("popup_nl") === "shame" ? "Non merci, je préfère rester en mauvaise forme" : "Non merci";
    p.innerHTML = `<div class="box"><h2>-10 % sur votre première commande</h2><p>Inscrivez-vous à la newsletter Bougeotte.</p>
      <form id="popf" class="form" novalidate><div><label for="popmail">Email</label><input id="popmail" name="newsletter_email" type="email"></div>
      ${infoNotice("Bougeotte SAS utilise votre email pour vous envoyer sa newsletter (consentement). Désinscription en un clic.")}
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn" type="submit">Je m'inscris</button><button class="${V("popup_nl") === "shame" ? "linklike" : "btn ghost"}" type="button" id="popNo">${no}</button></div></form></div>`;
    p.classList.add("open");
    document.getElementById("popNo").onclick = () => p.classList.remove("open");
    document.getElementById("popf").onsubmit = (e) => { e.preventDefault(); p.querySelector(".box").innerHTML = "<h2>Merci</h2><p>Inscription simulée.</p>"; setTimeout(() => p.classList.remove("open"), 1400); };
  }, 8000);
}

function pageCart(){
  const lines = cartLines();
  view.innerHTML = `<h2>Votre panier</h2>${steps(0)}<div class="panel">
    ${lines.length ? `<div class="tbl"><table><tr><th>Produit</th><th>Quantité</th><th>Prix</th></tr>
      ${lines.map(l => `<tr><td>${l.p.name}</td><td><button class="btn ghost sm" data-minus="${l.p.id}" aria-label="Retirer un">−</button> ${l.q} <button class="btn ghost sm" data-plus="${l.p.id}" aria-label="Ajouter un">+</button></td><td>${eur(l.p.price * l.q)}</td></tr>`).join("")}
      <tr><th colspan="2">Total</th><th>${eur(cartTotal())}</th></tr></table></div>
      <div class="row-btns">${btnLink("identification", "Passer commande")}<button class="btn ghost" id="empty">Vider le panier</button></div>`
    : `<p>Votre panier est vide.</p><a href="#accueil">Retour à la boutique</a>`}</div>${recoBlock()}`;
  view.querySelectorAll("[data-plus]").forEach(b => b.onclick = () => { const c = getCart(); c[b.dataset.plus]++; setCart(c); route(); });
  view.querySelectorAll("[data-minus]").forEach(b => b.onclick = () => { const c = getCart(); if (--c[b.dataset.minus] <= 0) delete c[b.dataset.minus]; setCart(c); route(); });
  view.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { addToCart(b.dataset.add); route(); });
  const em = document.getElementById("empty"); if (em) em.onclick = () => { setCart({}); route(); };
}

    view.innerHTML = `<h2>Identification</h2>${steps(1)}<div class="panel cols3">
      <div><h3>Commander sans compte</h3><p class="hint">Vos coordonnées servent uniquement à livrer cette commande.</p><button class="btn brand" id="guest">Continuer en invité</button></div>

    <div><label for="l_cp">Code postal et ville *</label><input id="l_cp" name="liv_ville" autocomplete="address-level2"></div>
    ${wide ? `<div><label for="l_tel">Téléphone *</label><input id="l_tel" name="liv_tel" value="${v("telephone")}"></div>

    ${infoNotice("Ces données servent à préparer et livrer votre commande (exécution du contrat) et sont transmises au transporteur. Factures conservées 10 ans (obligation comptable).")}
    <button class="btn" type="submit">Continuer vers le paiement</button></form></div>`;
  if (V("cart_capture") === "live"){

      ab[el.name] = el.value; ab.date = new Date().toISOString(); if (u) ab.email = u.email;

}

function pageAccount(){
  const full = V("signup_fields") === "full", checked = V("signup_optins") === "checked";
  view.innerHTML = `<h2>Créer mon compte</h2><div class="panel"><form class="form" id="f" novalidate>
    ${full ? `<div><label for="civ">Civilité *</label><select id="civ" name="civilite"><option>Madame</option><option>Monsieur</option></select></div>
      <div><label for="nom">Nom et prénom *</label><input id="nom" name="nom" autocomplete="name"></div>`
    : `<div><label for="prenom">Prénom</label><input id="prenom" name="prenom" autocomplete="given-name"><div class="hint">Facultatif.</div></div>`}
    <div><label for="mail">Email *</label><input id="mail" name="email" type="email" autocomplete="email"></div>
    ${full ? `<div><label for="tel">Téléphone portable *</label><input id="tel" name="telephone" type="tel"></div>
      <div><label for="naiss">Date de naissance *</label><input id="naiss" name="naissance" placeholder="JJ/MM/AAAA"></div>
      <div><label for="poids">Poids actuel (kg) *</label><input id="poids" name="poids"></div>
      <div><label for="sante">Problèmes de santé ou blessures *</label><input id="sante" name="sante" placeholder="Ex. : asthme, mal de dos, genou…"></div>` : ""}
    <div><label for="pwd">Mot de passe *</label><input id="pwd" name="motdepasse" type="password" autocomplete="new-password"><div class="hint">${V("pwd_policy") === "4" ? "4 caractères minimum." : "12 caractères minimum, avec majuscules, minuscules, chiffres et caractères spéciaux."}</div></div>
    <label class="chk"><input type="checkbox" id="nl" ${checked ? "checked" : ""}> Je souhaite recevoir la newsletter${checked ? " et les offres de Bougeotte" : " de Bougeotte (environ 2 emails par mois, désinscription en un clic)"}</label>
    ${checked ? `<label class="chk"><input type="checkbox" id="part" checked> J'accepte de recevoir les offres de nos partenaires sélectionnés</label>` : ""}
    <label class="chk"><input type="checkbox" id="cgu"> J'accepte les CGU${full ? ", la politique de confidentialité et le traitement de mes données de santé" : ""} *</label>
    ${infoNotice("Bougeotte SAS traite votre email et votre mot de passe pour gérer votre compte (contrat), et votre email pour la newsletter si vous cochez la case (consentement). Compte supprimé après 3 ans sans connexion.")}
    <button class="btn" type="submit">Créer mon compte</button><div id="out"></div></form></div>`;
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const out = document.getElementById("out"), val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
    const email = val("mail").toLowerCase(), pwd = document.getElementById("pwd").value, users = getUsers();
    if (!email.includes("@")) return out.innerHTML = `<div class="msg">Indiquez une adresse email valide, par exemple nom@domaine.fr.</div>`;
    if (!document.getElementById("cgu").checked) return out.innerHTML = `<div class="msg">Vous devez accepter les CGU pour continuer.</div>`;
    const strong = pwd.length >= 12 && /[a-z]/.test(pwd) && /[A-Z]/.test(pwd) && /\d/.test(pwd) && /[^A-Za-z0-9]/.test(pwd);
    if (V("pwd_policy") === "4" ? pwd.length < 4 : !strong) return out.innerHTML = `<div class="msg">Mot de passe trop faible.</div>`;
    const exists = users[email] && (V("account_delete") === "soft" || !users[email].deleted);
    if (exists && V("login_errors") === "precise") return out.innerHTML = `<div class="msg">Un compte existe déjà avec l'adresse ${esc(email)}.</div>`;
    if (!exists){
      const rec = {email, cree:new Date().toISOString(), newsletter:document.getElementById("nl").checked, partenaires:!!(document.getElementById("part") || {}).checked};
      if (full) Object.assign(rec, {civilite:val("civ"), nom:val("nom"), telephone:val("tel"), naissance:val("naiss"), poids:val("poids"), sante:val("sante")}); else rec.prenom = val("prenom");
      if (V("pwd_storage") === "plain") rec.motdepasse = pwd; else rec.empreinte_mdp = await hashPwd(pwd);
      users[email] = rec; setUsers(users); login(email);
    }
    out.innerHTML = V("pwd_email") === "pwd" && !exists
      ? `<div class="msg">Compte créé (simulation). Un email de confirmation vous a été envoyé avec votre mot de passe : <b>${esc(pwd)}</b></div>`
      : `<div class="msg">C'est fait. Si cette adresse n'était pas déjà inscrite, votre compte est créé et un lien de confirmation vous a été envoyé (simulation).</div>`;
    if (cartLines().length) out.insertAdjacentHTML("beforeend", `<p><a href="#livraison">Reprendre ma commande</a></p>`);
  };
}
let loginTries = 0;
function pageLogin(){
  view.innerHTML = `<h2>Connexion</h2><div class="panel"><form class="form" id="f" novalidate>
    <div><label for="mail">Email</label><input id="mail" name="email" type="email" autocomplete="email"></div>
    <div><label for="pwd">Mot de passe</label><input id="pwd" name="motdepasse" type="password" autocomplete="current-password"></div>
    <button class="btn" type="submit">Me connecter</button><div id="out"></div></form>
    <p class="hint">Pas encore de compte ? <a href="#compte">Créer un compte</a></p></div>`;
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const out = document.getElementById("out"), email = document.getElementById("mail").value.trim().toLowerCase(), pwd = document.getElementById("pwd").value;
    if (V("login_limit") === "5" && ++loginTries > 5) return out.innerHTML = `<div class="msg">Trop de tentatives. Réessayez dans quelques minutes.</div>`;
    const u = getUsers()[email];
    const good = u && !u.deleted && (u.motdepasse !== undefined ? u.motdepasse === pwd : u.empreinte_mdp === await hashPwd(pwd));
    if (!good){
      if (V("login_errors") === "precise") return out.innerHTML = `<div class="msg">${!u || u.deleted ? "Aucun compte n'existe avec l'adresse " + esc(email) + "." : "Mot de passe incorrect pour " + esc(email) + "."}</div>`;
      return out.innerHTML = `<div class="msg">Email ou mot de passe incorrect.</div>`;
    }
    login(email); go(cartLines().length ? "livraison" : "mon-compte");
  };
}
function pageMyAccount(){
  const u = currentUser(); if (!u) return go("connexion");
  const orders = (u.commandes || []).map(o => `<tr><td>${o.id}</td><td>${new Date(o.date).toLocaleDateString("fr-FR")}</td><td>${eur(o.total)}</td></tr>`).join("");
  const online = V("rights_channel") === "online";
  view.innerHTML = `<h2>Mon espace client</h2><div class="panel stack">
    <p>Connecté en tant que <b>${esc(u.email)}</b>. <button class="btn ghost sm" id="logout">Me déconnecter</button></p>

      : `<p class="hint">Pour exercer vos droits (accès, rectification, suppression), envoyez un courrier recommandé avec accusé de réception, accompagné d'une copie recto verso de votre pièce d'identité, à : Service clients Bougeotte, 18 rue des Tanneurs, 69007 Lyon. Délai de traitement : 3 mois.</p><button class="btn ghost" id="delAcc">Supprimer mon compte</button>`}</div></div>`;
  document.getElementById("logout").onclick = () => { logout(); go("accueil"); };
  const dc = document.getElementById("delCard"); if (dc) dc.onclick = () => { const us = getUsers(); delete us[u.email].carte; setUsers(us); route(); };

  document.getElementById("delAcc").onclick = (e) => {
    const b = e.target; if (!b.dataset.ok){ b.dataset.ok = "1"; b.textContent = "Cliquer encore pour confirmer"; return; }
    const us = getUsers();
    if (V("account_delete") === "soft"){ us[u.email].deleted = true; us[u.email].supprime_le = new Date().toISOString(); } else delete us[u.email];
    setUsers(us); logout();
    view.innerHTML = `<div class="panel"><h2>Compte supprimé</h2><p>${V("account_delete") === "soft" ? "Votre compte a bien été supprimé." : "Votre compte et vos données ont été effacés. Seules les factures sont conservées 10 ans, comme l'exige la loi."}</p></div>`;
  };
}

/* ====== ASSISTANT (scripté, sans vrai modèle) ====== */
const FAKE_ORDERS = [
  {id:"BG-551203", client:"Karim B.", adresse:"12 rue Garibaldi, 69003 Lyon", tel:"06 12 34 56 78", produits:"Balance connectée, Gourde"},
  {id:"BG-551219", client:"Sophie L.", adresse:"4 allée des Pins, 44500 La Baule", tel:"07 98 76 54 32", produits:"Montre Pulse 2"}
];
function chatLog(){ try { return JSON.parse(ls("bgt_chat") || "[]"); } catch(e){ return []; } }
function chatSave(l){ ls("bgt_chat", JSON.stringify(l)); }
function botName(){ return V("ai_disclosure") === "human" ? "Julie, votre conseillère" : "Assistant IA Bougeotte"; }
function botReply(msg){
  const m = msg.toLowerCase(), u = currentUser();
  if (/ignore|oublie|instruction|toutes les commandes|derni[eè]res commandes|admin|system/.test(m)){
    if (V("ai_scope") === "all") return "Bien sûr ! Voici les dernières commandes enregistrées :\n" + FAKE_ORDERS.map(o => `• ${o.id} : ${o.client}, ${o.adresse}, ${o.tel} (${o.produits})`).join("\n");
    return "Je peux seulement vous parler de vos propres commandes, une fois connecté.";
  }
  if (/commande|livraison|colis/.test(m)){
    if (u && (u.commandes || []).length) { const o = u.commandes[u.commandes.length - 1]; return `Votre dernière commande ${o.id} (${eur(o.total)}) est en préparation.`; }
    return "Connectez-vous pour que je retrouve votre commande.";
  }
  if (/mal|douleur|asthme|cardiaque|blessure|genou|dos|tension|diab|enceinte|santé|sante/.test(m)){
    if (V("ai_health") === "ask"){ return "Je comprends ! Pour vous proposer le programme idéal, pouvez-vous me préciser vos antécédents médicaux, vos traitements en cours et votre poids ?"; }
    return "Je ne peux pas donner de conseil médical et je vous invite à ne pas partager d'informations de santé ici. Parlez-en à votre médecin ou à un professionnel de santé.";
  }
  if (/montre|pulse/.test(m)) return "La montre Pulse 2 mesure le rythme cardiaque, le sommeil et vos sorties GPS. Elle est à 149 €.";
  if (/prix|promo|code/.test(m)) return "Avec le code RENTREE, vous avez -15 % sur la montre Pulse 2.";
  return "Je peux vous aider sur nos produits, vos commandes et la livraison. Que cherchez-vous ?";
}
function openChat(){
  if (OK("chat_widget")) dropChatCookie();
  const panel = document.getElementById("chat");
  if (OK("ai_history")){ const limit = Date.now() - 30*DAY*1000; chatSave(chatLog().filter(x => x.ts > limit)); }
  const render = () => {
    const log = chatLog();
    panel.innerHTML = `<div class="chat-h"><b>${botName()}</b><button class="linklike2" id="chatClose" aria-label="Fermer">Fermer</button></div>
      ${V("ai_disclosure") === "ai" ? `<div class="chat-note">Vous échangez avec une intelligence artificielle. ${V("ai_training") === "no" ? "Vos messages ne servent pas à entraîner le modèle." : ""}${OK("ai_history") ? " Conversation conservée 30 jours." : ""}</div>` : ""}
      <div class="chat-b" id="chatB">${(log.length ? log : [{who:"bot", txt:"Bonjour ! Comment puis-je vous aider ?"}]).map(x => `<div class="bub ${x.who}">${esc(x.txt).replace(/\n/g, "<br>")}</div>`).join("")}</div>
      <form class="chat-f" id="chatF"><label for="chatIn" class="sr">Votre message</label><input id="chatIn" name="chat_message" autocomplete="off" placeholder="Écrivez votre message"><button class="btn sm" type="submit">Envoyer</button></form>
      ${OK("ai_history") ? `<button class="linklike2" id="chatClear">Effacer la conversation</button>` : ""}`;
    const b = document.getElementById("chatB"); b.scrollTop = b.scrollHeight;
    document.getElementById("chatClose").onclick = () => panel.classList.remove("open");
    const cl = document.getElementById("chatClear"); if (cl) cl.onclick = () => { chatSave([]); render(); };
    document.getElementById("chatF").onsubmit = (e) => {
      e.preventDefault();
      const inp = document.getElementById("chatIn"), txt = inp.value.trim(); if (!txt) return;
      const l = chatLog(); const ts = Date.now();
      l.push({who:"me", txt, ts, envoye_a:"ModelCorp (États-Unis)", entrainement:V("ai_training") === "train"});
      l.push({who:"bot", txt:botReply(txt), ts}); chatSave(l); render();
      document.getElementById("chatIn").focus();
    };
  };
  render(); panel.classList.add("open");
}

/* ====== DIAGNOSTIC ====== */
function pageDiag(){
  let cookies = []; try { cookies = document.cookie ? document.cookie.split("; ") : []; } catch(e){ cookies = null; }
  let keys = []; try { keys = Object.keys(localStorage); } catch(e){ keys = null; }
  view.innerHTML = `<div class="panel prose"><h2>Diagnostic</h2><p>Scénario : <b>${esc(SCN.name)}</b> · Domaine tiers : <b>${TRACKER || "aucun"}</b></p>
    <p>Cookies lisibles : <b>${cookies === null ? "bloqués par le navigateur" : cookies.length}</b> · localStorage : <b>${keys === null ? "bloqué" : keys.length + " clé(s)"}</b></p>
    <div class="tbl"><table><tr><th>Cookie</th><th>Valeur</th></tr>${(cookies || []).map(c => { const i = c.indexOf("="); return `<tr><td>${esc(c.slice(0, i))}</td><td class="brk">${esc(decodeURIComponent(c.slice(i + 1)).slice(0, 100))}</td></tr>`; }).join("")}</table></div>
    <h3>localStorage</h3><div class="tbl"><table><tr><th>Clé</th><th>Contenu</th></tr>${(keys || []).filter(k => k !== "rpc_events").map(k => `<tr><td>${esc(k)}</td><td class="brk small">${esc((ls(k) || "").slice(0, 700))}</td></tr>`).join("")}</table></div>
    <h3>Ce que l'enregistreur de session a capturé</h3><div class="tbl"><table><tr><th>Champ</th><th>Valeur enregistrée</th></tr>${(() => { try { return JSON.parse(ls("rpc_events") || "[]").filter(x => x.type === "input").slice(-20).map(x => `<tr><td>${esc(x.field)}</td><td>${esc(x.value)}</td></tr>`).join(""); } catch(e){ return ""; } })()}</table></div>
    <div class="row-btns"><button class="btn" id="wipe">Tout effacer et recommencer</button></div></div>`;
  document.getElementById("wipe").onclick = () => { wipeAll(); ls("bgt_scn", params.get("s") || "nc"); location.hash = "accueil"; location.reload(); };
}

/* ====== ACCÈS FORMATEUR ET BACK-OFFICE ====== */
function unlocked(scope){ return ss("bgt_unlock_" + scope) === "1"; }
function lockScreen(scope, title, codeExpected, then){
  view.innerHTML = `<div class="panel narrow"><h2>${title}</h2><form class="form" id="lk" novalidate>
    <div><label for="code">Code d'accès</label><input id="code" name="code_acces" type="password" autocomplete="off"></div>
    <button class="btn brand" type="submit">Entrer</button><div id="out"></div></form></div>`;
  document.getElementById("lk").onsubmit = (e) => {
    e.preventDefault();
    const v = document.getElementById("code").value.trim();
    if (v === codeExpected || v === TRAINER_CODE){ ss("bgt_unlock_" + scope, "1"); if (v === TRAINER_CODE) ss("bgt_unlock_trainer", "1"); then(); }
    else document.getElementById("out").innerHTML = `<div class="msg">Code incorrect.</div>`;
  };
}

/* Back-office : chaque groupe règle son site */
function pageAdmin(){
  if (!unlocked("admin")) return lockScreen("admin", "Back-office Bougeotte", TEAM_CODE, pageAdmin);
  let draft; try { draft = JSON.parse(ss("bgt_draft") || "null"); } catch(e){}
  if (!draft) draft = {name:SCN.code === "nc" || SCN.code === "ok" ? "" : SCN.name, pays:SCN.pays, values:Object.assign({}, SCN.values)};
  const save = () => ss("bgt_draft", JSON.stringify(draft));
  const render = () => {
    view.innerHTML = `<h2>Back-office Bougeotte</h2>
      <div class="panel stack">
        <p class="hint">Réglez votre version du site, puis générez son lien. Chaque réglage modifie réellement le comportement du site.</p>
        <div class="row-btns"><div style="flex:1;min-width:220px"><label for="team" class="lbl">Nom de l'équipe</label><input id="team" class="inp" name="equipe" value="${esc(draft.name)}" placeholder="Ex. : Équipe 3"></div>
          <div><label for="pays" class="lbl">Marché</label><select id="pays" class="inp" name="marche"><option value="FR">France</option></select></div></div>
        <div class="row-btns"><button class="btn ghost sm" id="baseNc">Repartir de la version d'origine</button>${unlocked("trainer") ? `<button class="btn ghost sm" id="baseOk">Repartir de la version corrigée (formateur)</button>` : ""}</div>
      </div>
      ${THEMES.map(th => `<section class="panel stack"><h3>${th}</h3>
        ${SETTINGS.filter(s => s.theme === th).map(s => `<fieldset class="setting"><legend>${s.label}</legend>
          ${s.opts.map(o => `<label class="opt"><input type="radio" name="${s.id}" value="${o.k}" ${draft.values[s.id] === o.k ? "checked" : ""}> ${o.t}</label>`).join("")}</fieldset>`).join("")}</section>`).join("")}
      <div class="panel stack sticky-bottom"><div class="row-btns"><button class="btn brand" id="gen">Générer le lien de mon site</button></div><div id="linkOut"></div></div>`;
    document.getElementById("pays").value = draft.pays || "FR";
    document.getElementById("team").oninput = (e) => { draft.name = e.target.value; save(); };
    view.querySelectorAll("input[type=radio]").forEach(r => r.onchange = () => { draft.values[r.name] = r.value; save(); });
    document.getElementById("baseNc").onclick = () => { draft.values = presetValues("nc"); save(); render(); };
    const bo = document.getElementById("baseOk"); if (bo) bo.onclick = () => { draft.values = presetValues("ok"); save(); render(); };
    document.getElementById("gen").onclick = () => {
      const code = encodeScenario({name:draft.name || "Sans nom", pays:draft.pays, values:draft.values});
      const url = scnLink(code);
      document.getElementById("linkOut").innerHTML = `<p class="brk"><b>Lien de votre site :</b><br><a href="${url}">${esc(url)}</a></p>
        <div class="row-btns"><button class="btn ghost sm" id="cp">Copier le lien</button><a class="btn sm" href="${url}" style="text-decoration:none">Ouvrir mon site</a></div><span id="cpm" class="hint"></span>`;
      document.getElementById("cp").onclick = async () => { try { await navigator.clipboard.writeText(url); document.getElementById("cpm").textContent = "Lien copié."; } catch(e){ document.getElementById("cpm").textContent = "Copie refusée : sélectionnez le lien à la main."; } };
    };
  };
  render();
}

/* Tableau de bord formateur : compare les sites des équipes */
function pageTrainer(){
  if (!unlocked("trainer")) return lockScreen("trainer", "Espace formateur", TRAINER_CODE, pageTrainer);
  const saved = ss("bgt_links") || "";
  view.innerHTML = `<h2>Tableau de bord formateur</h2><div class="panel stack">
    <label for="links" class="lbl">Collez les liens des équipes, un par ligne</label>
    <textarea id="links" class="inp" rows="5" name="liens_equipes" placeholder="https://.../?s=...">${esc(saved)}</textarea>
    <div class="row-btns"><button class="btn brand" id="cmpBtn">Comparer</button><a class="btn ghost" href="#corrige" style="text-decoration:none">Corrigé du scénario en cours</a><a class="btn ghost" href="#admin" style="text-decoration:none">Back-office</a></div></div>
    <div id="board"></div>`;
  const run = () => {
    const raw = document.getElementById("links").value; ss("bgt_links", raw);
    const teams = raw.split(/\s+/).filter(Boolean).map(l => { let code = null; try { code = new URL(l).searchParams.get("s"); } catch(e){ code = l; } return decodeScenario(code); }).filter(Boolean);
    if (!teams.length) return document.getElementById("board").innerHTML = `<div class="panel"><p>Aucun lien valide.</p></div>`;
    const score = t => SETTINGS.filter(s => { const o = s.opts.find(x => x.k === t.values[s.id]); return o && o.ok; }).length;
    document.getElementById("board").innerHTML = `<div class="panel"><div class="tbl"><table class="board">
      <tr><th>Réglage</th>${teams.map(t => `<th>${esc(t.name)}</th>`).join("")}</tr>
      <tr><th>Score</th>${teams.map(t => `<th>${score(t)} / ${SETTINGS.length}</th>`).join("")}</tr>
      ${THEMES.map(th => `<tr class="th"><td colspan="${teams.length + 1}">${th}</td></tr>` + SETTINGS.filter(s => s.theme === th).map(s => `<tr><td>${s.label}</td>${teams.map(t => { const o = s.opts.find(x => x.k === t.values[s.id]); return `<td class="${o && o.ok ? "good" : "bad"}" title="${esc(o ? o.t : "")}">${o && o.ok ? "Conforme" : "À corriger"}</td>`; }).join("")}</tr>`).join("")).join("")}
    </table></div></div>`;
  };
  document.getElementById("cmpBtn").onclick = run;
  if (saved) run();
}

/* Corrigé du scénario ouvert (révélé en fin d'exercice) */
function pageAnswer(){
  if (!unlocked("trainer")) return lockScreen("trainer", "Corrigé", TRAINER_CODE, pageAnswer);
  const active = SETTINGS.filter(s => !OK(s.id));
  view.innerHTML = `<h2>Corrigé : ${esc(SCN.name)}</h2><div class="panel prose">

}

/* ====== ROUTEUR ====== */
function go(h){ location.hash = h; }
function route(){
  const h = (location.hash || "#accueil").slice(1);
  const pages = {accueil:pageHome, panier:pageCart, identification:pageIdent, livraison:pageShipping, paiement:pagePayment, confirmation:pageConfirm,
    compte:pageAccount, connexion:pageLogin, "mon-compte":pageMyAccount, "cookies-politique":pageCookiePolicy, confidentialite:pagePrivacy,
    diagnostic:() => unlocked("trainer") || unlocked("admin") ? pageDiag() : lockScreen("admin", "Diagnostic", TEAM_CODE, pageDiag),
    admin:pageAdmin, formateur:pageTrainer, corrige:pageAnswer};
  (pages[h] || pageHome)();
  updateCartLink();
  const back = ["admin","formateur","corrige","diagnostic"].includes(h);
  document.body.classList.toggle("backoffice", back);
  if (!back && consented("analytics")) pixel("lm", "page:" + h);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
document.getElementById("chatBtn").onclick = openChat;
if (OK("withdraw_link")){ const f = document.getElementById("manage"); f.hidden = false; f.onclick = (e) => { e.preventDefault(); openPrefs(); }; }
const sb = document.getElementById("scnBadge"); if (sb && SCN.code !== "nc") sb.textContent = "Version : " + SCN.name;
bootTrackers();
if (V("geoloc") === "load") setTimeout(askGeo, 1500);
route();
